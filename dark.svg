<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISUAL.MAP // Profile HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.4);
      --cyan-subtle: rgba(0, 240, 255, 0.12);
      --bg-dark: #02070d;
      --bg-card: rgba(2, 16, 28, 0.7);
      --glow-cyan: 0 0 10px rgba(0, 240, 255, 0.7), 0 0 20px rgba(0, 240, 255, 0.3);
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse at center, #062238 0%, #01060c 100%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--neon-cyan);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    /* Outer HUD Container */
    .hud-window {
      width: 1200px;
      max-width: 100%;
      border: 2px solid var(--neon-cyan);
      box-shadow: var(--glow-cyan), inset 0 0 20px rgba(0, 240, 255, 0.2);
      background: rgba(1, 9, 18, 0.9);
      position: relative;
      padding: 16px 20px;
      border-radius: 4px;
    }

    /* Scanline effect overlay */
    .hud-window::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 240, 255, 0.015),
        rgba(0, 240, 255, 0.015) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Top Navigation Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--neon-cyan);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .brand-title {
      font-family: var(--font-ui);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: var(--glow-cyan);
      border: 2px solid var(--neon-cyan);
      padding: 2px 14px;
      clip-path: polygon(0 0, 92% 0, 100% 30%, 100% 100%, 8% 100%, 0 70%);
      background: rgba(0, 240, 255, 0.1);
    }

    .header-center {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      opacity: 0.85;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .win-btn {
      width: 18px;
      height: 18px;
      border: 1px solid var(--neon-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
    }

    /* HUD Layout Grid */
    .hud-grid {
      display: grid;
      grid-template-columns: 240px 1fr 400px;
      gap: 20px;
    }

    /* Corner brackets helper */
    .bracket-box {
      position: relative;
      border: 1px solid rgba(0, 240, 255, 0.25);
      background: var(--bg-card);
      padding: 12px;
    }

    .bracket-box::before, .bracket-box::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: var(--neon-cyan);
      border-style: solid;
    }
    .bracket-box::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .bracket-box::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    /* Left Column */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .action-tags {
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 2px;
      border-left: 2px solid var(--neon-cyan);
      padding-left: 10px;
    }

    .scan-status {
      font-size: 11px;
      line-height: 1.8;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .wireframe-globe {
      width: 70px;
      height: 70px;
      border: 1px dashed var(--neon-cyan);
      border-radius: 50%;
      position: relative;
      margin: 8px 0;
      animation: rotateGlobe 12s linear infinite;
    }

    .wireframe-globe::after {
      content: "";
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 1px;
      border-top: 1px solid var(--neon-cyan);
      transform: translateY(-50%);
    }

    @keyframes rotateGlobe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .geo-location {
      font-size: 12px;
      line-height: 1.5;
    }

    .equalizer-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 36px;
      margin-top: 6px;
    }

    .eq-bar {
      flex: 1;
      background: var(--neon-cyan);
      animation: pulseBar 1.2s ease-in-out infinite alternate;
    }

    @keyframes pulseBar {
      0% { height: 15%; opacity: 0.4; }
      100% { height: 95%; opacity: 1; }
    }

    /* Center Section (Avatar & Reticle) */
    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .reticle-container {
      position: relative;
      width: 380px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed var(--neon-cyan);
      opacity: 0.6;
    }

    .ring-1 { width: 370px; height: 370px; border-style: solid; border-width: 2px; border-color: transparent var(--neon-cyan) var(--neon-cyan) transparent; animation: spin 20s linear infinite; }
    .ring-2 { width: 340px; height: 340px; border: 1px dashed var(--neon-cyan); }
    .ring-3 { width: 310px; height: 310px; border: 2px solid var(--neon-cyan); border-left-color: transparent; }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .avatar-wrapper {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--neon-cyan);
      box-shadow: var(--glow-cyan);
      position: relative;
      background: #031526;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(115%) saturate(80%) drop-shadow(0 0 10px #00f0ff);
    }

    /* Name Plate */
    .name-banner {
      width: 100%;
      text-align: center;
      border: 2px solid var(--neon-cyan);
      clip-path: polygon(15px 0%, calc(100% - 15px) 0%, 100% 15px, 100% 100%, calc(100% - 15px) 100%, 15px 100%, 0% calc(100% - 15px), 0% 15px);
      background: rgba(0, 240, 255, 0.08);
      padding: 12px;
      margin-top: 14px;
    }

    .name-title {
      font-family: var(--font-ui);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      text-shadow: var(--glow-cyan);
    }

    .status-pill {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      border: 1px solid var(--neon-cyan);
      padding: 2px 12px;
      letter-spacing: 2px;
    }

    /* Right Column (Cards) */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card {
      border: 1px solid var(--cyan-dim);
      background: var(--bg-card);
      padding: 14px 16px;
      position: relative;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--cyan-dim);
      padding-bottom: 6px;
      margin-bottom: 12px;
      font-family: var(--font-ui);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .striped-accent {
      letter-spacing: 2px;
      font-size: 14px;
      opacity: 0.7;
    }

    .profile-info {
      font-size: 13px;
      line-height: 1.6;
    }

    .user-name-tag {
      font-size: 20px;
      font-weight: 700;
      font-family: var(--font-ui);
      margin-bottom: 4px;
    }

    .badges-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .badge {
      font-size: 11px;
      border: 1px solid var(--neon-cyan);
      padding: 3px 8px;
      border-radius: 3px;
      background: var(--cyan-subtle);
      letter-spacing: 1px;
    }

    /* Tech Stack Grid */
    .tech-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      text-align: center;
    }

    .tech-box {
      border: 1px solid var(--cyan-dim);
      padding: 10px 4px;
      background: rgba(0, 240, 255, 0.05);
      border-radius: 4px;
    }

    .tech-icon {
      font-size: 22px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .tech-label {
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* Core Stacks Bars */
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .stat-bar-wrapper {
      flex: 1;
      height: 8px;
      background: rgba(0, 240, 255, 0.15);
      margin: 0 10px;
      border-radius: 2px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      background: var(--neon-cyan);
      box-shadow: 0 0 6px var(--neon-cyan);
    }

    /* Footer */
    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1px dashed var(--cyan-dim);
      font-size: 12px;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="hud-window">
    <!-- Top System Header -->
    <header class="header-bar">
      <div class="brand-title">VISUAL.MAP</div>
      <div class="header-center">// PROFILE.EXE</div>
      <div class="header-right">
        <span id="live-clock">2026.09.15 22:34:27</span>
        <div class="window-controls">
          <div class="win-btn">—</div>
          <div class="win-btn">◻</div>
          <div class="win-btn">✕</div>
        </div>
      </div>
    </header>

    <!-- Main Workspace Grid -->
    <div class="hud-grid">
      
      <!-- Left Diagnostics Column -->
      <section class="left-col">
        <div class="action-tags">
          EXPLORE<br>LEARN<br>BUILD<br>IMPROVE<br>REPEAT
        </div>

        <div class="bracket-box scan-status">
          SCAN MODE<br>
          &gt; FACE RECOGNITION<br>
          &gt; ID CONFIRMED<br>
          &gt; PROFILE LOADED<br>
          &gt; ALL SYSTEMS ONLINE
        </div>

        <div class="geo-location">
          <div class="wireframe-globe"></div>
          <div>12.9716° N</div>
          <div>77.5946° E</div>
          <div style="margin-top: 4px;">📍 BENGALURU, INDIA</div>
        </div>

        <div class="bracket-box">
          <div style="font-size: 11px; letter-spacing: 1px;">SYSTEM OUTPUT</div>
          <div class="equalizer-bars">
            <div class="eq-bar" style="animation-delay: 0.1s;"></div>
            <div class="eq-bar" style="animation-delay: 0.4s;"></div>
            <div class="eq-bar" style="animation-delay: 0.2s;"></div>
            <div class="eq-bar" style="animation-delay: 0.6s;"></div>
            <div class="eq-bar" style="animation-delay: 0.3s;"></div>
            <div class="eq-bar" style="animation-delay: 0.5s;"></div>
          </div>
          <div style="font-size: 10px; margin-top: 8px; line-height: 1.4; opacity: 0.8;">
            TURNING IDEAS INTO REAL-WORLD SOLUTIONS
          </div>
        </div>
      </section>

      <!-- Center HUD Reticle & Identity -->
      <section class="center-col">
        <div class="reticle-container">
          <div class="circle-ring ring-1"></div>
          <div class="circle-ring ring-2"></div>
          <div class="circle-ring ring-3"></div>
          
          <div class="avatar-wrapper">
            <!-- Replace placeholder with actual photo link if preferred -->
            <img class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Avatar Target">
          </div>
        </div>

        <div class="name-banner">
          <div class="name-title">K.R. SAI VARUN</div>
          <div class="status-pill">&lt; SYSTEM ONLINE &gt;</div>
        </div>
      </section>

      <!-- Right Code / Profile Metrics Column -->
      <section class="right-col">
        
        <!-- System Code Bio -->
        <div class="panel-card">
          <div class="panel-header">
            <span>SYSTEM CODE</span>
            <span class="striped-accent">/////// ⧉</span>
          </div>
          <div class="profile-info">
            <div class="user-name-tag">👤 K.R. SAI VARUN</div>
            <div style="margin-bottom: 8px;">📍 Bengaluru, India</div>
            <p style="font-size: 12px; opacity: 0.85; line-height: 1.5;">
              Developer passionate about building scalable applications, working with data, and exploring AI/ML &amp; NLP to solve real-world problems.
            </p>
            <div class="badges-flex">
              <span class="badge">DEVELOPER</span>
              <span class="badge">PYTHONISTA</span>
              <span class="badge">AI EXPLORER</span>
              <span class="badge">PROBLEM SOLVER</span>
              <span class="badge">LIFELONG LEARNER</span>
            </div>
          </div>
        </div>

        <!-- Tech Stack -->
        <div class="panel-card">
          <div class="panel-header">
            <span>TECH STACK</span>
            <span class="striped-accent">/////// ⧉</span>
          </div>
          <div class="tech-grid">
            <div class="tech-box">
              <div class="tech-icon">🐍</div>
              <div class="tech-label">Python</div>
            </div>
            <div class="tech-box">
              <div class="tech-icon">dj</div>
              <div class="tech-label">Django</div>
            </div>
            <div class="tech-box">
              <div class="tech-icon">🐘</div>
              <div class="tech-label">PostgreSQL</div>
            </div>
            <div class="tech-box">
              <div class="tech-icon">🕸️</div>
              <div class="tech-label">NLP</div>
            </div>
          </div>
        </div>

        <!-- Core Stacks Performance -->
        <div class="panel-card">
          <div class="panel-header">
            <span>CORE STACKS</span>
            <span class="striped-accent">/////// ⧉</span>
          </div>
          
          <div class="stat-row">
            <span style="width: 80px;">Python</span>
            <div class="stat-bar-wrapper">
              <div class="stat-bar-fill" style="width: 98.42%;"></div>
            </div>
            <span>98.42%</span>
          </div>

          <div class="stat-row">
            <span style="width: 80px;">Django</span>
            <div class="stat-bar-wrapper">
              <div class="stat-bar-fill" style="width: 5.5%;"></div>
            </div>
            <span>5.50%</span>
          </div>

          <div class="stat-row">
            <span style="width: 80px;">PostgreSQL</span>
            <div class="stat-bar-wrapper">
              <div class="stat-bar-fill" style="width: 2.75%;"></div>
            </div>
            <span>0.75%</span>
          </div>

          <div class="stat-row">
            <span style="width: 80px;">NLP</span>
            <div class="stat-bar-wrapper">
              <div class="stat-bar-fill" style="width: 2.15%;"></div>
            </div>
            <span>0.15%</span>
          </div>
        </div>

      </section>

    </div>

    <!-- HUD Footer -->
    <footer class="hud-footer">
      <div>VISUAL.MAP <span style="opacity: 0.6; margin-left: 10px;">v1.0.0</span></div>
      <div>// BUILDING A SMARTER TOMORROW...</div>
    </footer>
  </div>

  <script>
    // Live HUD Timestamp updater
    function updateHUDTime() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const formatted = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('live-clock').innerText = formatted;
    }
    setInterval(updateHUDTime, 1000);
    updateHUDTime();
  </script>
</body>
</html>
