<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="K.R. Sai Varun — Full-Stack Developer profile. Django, React, AI-powered applications.">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#07111F" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#030712" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#01040A" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="accent-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="edge-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="22%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="1"/>
      <stop offset="78%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <filter id="cyan-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feGaussianBlur stdDeviation="1.5" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="0.7" fill="#22D3EE" opacity="0.10"/>
    </pattern>

    <pattern id="ascii-grid" x="0" y="0" width="10" height="12" patternUnits="userSpaceOnUse">
      <text x="0" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" fill="#22D3EE" opacity="0.35">.</text>
    </pattern>

    <clipPath id="portrait-clip">
      <rect x="55" y="118" width="410" height="420" rx="10"/>
    </clipPath>

    <mask id="type-mask-1">
      <rect x="0" y="0" width="0" height="40" fill="#fff">
        <animate attributeName="width" from="0" to="440" dur="0.9s" begin="0.4s" fill="freeze"/>
      </rect>
    </mask>
    <mask id="type-mask-2">
      <rect x="0" y="0" width="0" height="40" fill="#fff">
        <animate attributeName="width" from="0" to="440" dur="0.7s" begin="1.3s" fill="freeze"/>
      </rect>
    </mask>
    <mask id="type-mask-3">
      <rect x="0" y="0" width="0" height="40" fill="#fff">
        <animate attributeName="width" from="0" to="440" dur="1.1s" begin="2.0s" fill="freeze"/>
      </rect>
    </mask>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .label { fill: #38BDF8; font-weight: 600; letter-spacing: 2px; }
    .value { fill: #F8FAFC; }
    .muted { fill: #94A3B8; }
    .accent { fill: #22D3EE; }
    .violet { fill: #A78BFA; }
    .ok { fill: #10B981; }
  </style>

  <!-- Outer frame -->
  <rect x="12" y="12" width="1156" height="586" rx="22" fill="#02060F" stroke="#22D3EE" stroke-width="1.4" stroke-opacity="0.55" filter="url(#cyan-glow)"/>
  <rect x="15" y="15" width="1150" height="580" rx="20" fill="url(#bg-glow)"/>
  <rect x="15" y="15" width="1150" height="580" rx="20" fill="url(#grid-dots)"/>

  <!-- Animated border shimmer -->
  <rect x="15" y="15" width="1150" height="580" rx="20" fill="none" stroke="url(#edge-shimmer)" stroke-width="1.6" stroke-dasharray="140 980">
    <animate attributeName="stroke-dashoffset" from="0" to="-1120" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Top terminal bar -->
  <circle cx="46" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="66" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="86" cy="46" r="6" fill="#27C93F"/>

  <text x="112" y="51" class="mono label" font-size="12">sai@developer:~</text>
  <text x="298" y="51" class="mono" font-size="11" fill="#10B981" opacity="0.9">[ ● ONLINE ]</text>

  <text x="980" y="51" class="mono muted" font-size="11">&lt;&gt; Code</text>
  <text x="1052" y="51" class="mono muted" font-size="11">Projects</text>
  <text x="1052" y="51" class="mono muted" font-size="11" opacity="0"> </text>

  <!-- Divider -->
  <line x1="30" y1="66" x2="1150" y2="66" stroke="#22D3EE" stroke-opacity="0.18"/>

  <!-- ================= LEFT PANEL — VISUAL.IDENTITY ================= -->
  <g transform="translate(0,0)">
    <rect x="40" y="88" width="440" height="494" rx="16" fill="#0F172A" fill-opacity="0.35" stroke="#22D3EE" stroke-opacity="0.30" stroke-width="1"/>
    <path d="M 52 88 L 152 88 L 142 106 L 52 106 Z" fill="#22D3EE" fill-opacity="0.14"/>
    <text x="58" y="101" class="mono label" font-size="10" letter-spacing="1.6">VISUAL.MAP</text>

