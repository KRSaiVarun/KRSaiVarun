<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual.Map - K.R. Sai Varun</title>
    <style>
        :root {
            --cyan: #00ffff;
            --dark-cyan: #00aaaa;
            --black: #000000;
            --grid: rgba(0, 255, 255, 0.1);
        }

        body {
            background-color: var(--black);
            color: var(--cyan);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Scanline effect */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0) 50%, rgba(0,255,255,0.05) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* Main Container */
        .os-window {
            width: 80vw;
            height: 80vh;
            border: 2px solid var(--cyan);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            background: linear-gradient(45deg, #0a0a0a 0%, #1a1a1a 100%);
            display: flex;
            overflow: hidden;
        }

        /* Grid Background */
        .os-window::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* Title Bar */
        .title-bar {
            position: absolute;
            top: 0; left: 0; width: 100%;
            height: 30px;
            border-bottom: 2px solid var(--cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            background: var(--black);
            z-index: 5;
        }

        .title { font-weight: bold; }
        .controls span { margin-left: 10px; cursor: pointer; }

        /* Left Content: The Map/Profile */
        .map-section {
            flex: 2;
            padding-top: 30px; /* Space for title bar */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* The stylized profile - using a combination of border-radius and pseudo-elements */
        .profile-stylized {
            width: 70%;
            height: 80%;
            border: 2px solid var(--cyan);
            border-radius: 50% 50% 10px 10px;
            position: relative;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMCIgaGVpZ2h0PSIzMCI+PGNpcmNsZSBjeD0iMTUiIGN5PSIxNSIgcj0iMSIgZmlsbD0icmdiYSgwLCAyNTUsIDI1NSwgMC4zKSIvPjwvc3ZnPg=='); /* Dotted pattern fallback */
            overflow: hidden;
        }

        /* Dotted grid texture over profile */
        .profile-stylized::before {
            content: "";
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image: radial-gradient(var(--cyan) 1px, transparent 1px);
            background-size: 5px 5px;
            opacity: 0.3;
            transform: rotate(45deg);
        }

        /* Simple line-art mouth */
        .profile-stylized::after {
            content: "____";
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: var(--cyan);
            font-size: 2em;
            letter-spacing: -2px;
        }

        /* Right Content: Stats */
        .data-section {
            flex: 1;
            padding: 40px 20px 20px;
            border-left: 2px solid var(--cyan);
            background: rgba(0,0,0,0.5);
            z-index: 2;
            overflow-y: auto;
        }

        h2 { font-size: 1.2em; border-bottom: 1px solid var(--cyan); padding-bottom: 5px; margin-top: 0; }
        .stat-group { margin-bottom: 20px; }
        .data-item { margin: 5px 0; font-size: 0.9em; }
        .item-label { color: var(--dark-cyan); }
        .item-value { float: right; }

        /* Icon 'stamps' */
        .tech-icons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .icon-row {
            border: 1px solid var(--cyan);
            padding: 5px;
            display: flex;
            align-items: center;
            font-size: 0.8em;
        }

        .icon-box {
            width: 20px; height: 20px;
            border: 1px solid var(--cyan);
            margin-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--black);
            background-color: var(--cyan);
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="os-window">
        <div class="title-bar">
            <span class="title">VISUAL.MAP</span>
            <div class="controls">
                <span>_</span>
                <span>&#9634;</span>
                <span>X</span>
            </div>
        </div>

        <div class="map-section">
            <div class="profile-stylized"></div>
        </div>

        <div class="data-section">
            <div class="stat-group">
                <h2>SYSTEM CODE</h2>
                <div class="data-item">K.R. Sai Varun</div>
                <div class="data-item">Bengaluru</div>
            </div>

            <div class="tech-icons">
                <div class="icon-row"><div class="icon-box">Py</div> Python</div>
                <div class="icon-row"><div class="icon-box">dj</div> Django</div>
                <div class="icon-row"><div class="icon-box">Pg</div> PostgreSQL</div>
                <div class="icon-row"><div class="icon-box">NL</div> NLP</div>
            </div>

            <div class="stat-group">
                <h2>CORE STACKS</h2>
                <div class="data-item">
                    <span class="item-label">Python</span>
                    <span class="item-value">98.42%</span>
                </div>
                <div class="data-item">
                    <span class="item-label">Django</span>
                    <span class="item-value">5.50%</span>
                </div>
                <div class="data-item">
                    <span class="item-label">PostgreSQL</span>
                    <span class="item-value">0.75%</span>
                </div>
                <div class="data-item">
                    <span class="item-label">NLP</span>
                    <span class="item-value">0.15%</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
