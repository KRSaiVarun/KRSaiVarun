<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580">
  <defs>
    <pattern id="faceDots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#F5C9A6"/>
    </pattern>
    <pattern id="skinShadow" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#D9A17C"/>
    </pattern>
    <pattern id="hairDots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.4" fill="#1A1010"/>
    </pattern>
    <pattern id="shirtDots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.3" fill="#0B0B0F" opacity="0.95"/>
    </pattern>
    <linearGradient id="warmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B98A"/>
      <stop offset="100%" stop-color="#C98A5A"/>
    </linearGradient>
    <linearGradient id="chainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#9A9A9A"/>
    </linearGradient>
  </defs>

  <!-- Warm background -->
  <rect x="0" y="0" width="520" height="580" fill="url(#warmBg)"/>

  <!-- Blurred menu board hint -->
  <g opacity="0.35">
    <rect x="290" y="120" width="210" height="260" fill="#F2E6D0" rx="4"/>
    <rect x="300" y="140" width="180" height="4" fill="#3A2A1A"/>
    <rect x="300" y="160" width="150" height="3" fill="#5A4632"/>
    <rect x="300" y="180" width="170" height="3" fill="#5A4632"/>
    <rect x="300" y="200" width="140" height="3" fill="#5A4632"/>
    <rect x="300" y="220" width="160" height="3" fill="#5A4632"/>
  </g>

  <!-- Wood panel hints -->
  <g opacity="0.4" stroke="#7A4A22" stroke-width="2" fill="none">
    <path d="M 0 300 H 520"/>
    <path d="M 0 360 H 520"/>
    <path d="M 100 200 V 400"/>
    <path d="M 240 180 V 400"/>
  </g>

  <!-- Shoulders / black shirt -->
  <path d="M 20 580
           L 40 470
           Q 90 400 180 385
           L 220 375
           L 300 375
           L 340 385
           Q 430 400 480 470
           L 500 580 Z"
        fill="url(#shirtDots)"
        stroke="#05050A"
        stroke-width="2"/>

  <!-- White inner collar -->
  <path d="M 200 375
           L 230 430
           L 270 400
           L 310 430
           L 340 380
           L 320 375
           L 270 395
           L 220 375 Z"
        fill="#EDEDED"
        stroke="#B0B0B0"
        stroke-width="1.2"/>

  <!-- Neck -->
  <path d="M 220 310
           L 218 385
           Q 260 405 305 385
           L 305 310 Z"
        fill="url(#skinShadow)"/>

  <!-- Silver chain -->
  <path d="M 235 400
           Q 260 445 290 400"
        fill="none"
        stroke="url(#chainGrad)"
        stroke-width="3"
        stroke-linecap="round"/>
  <circle cx="262" cy="448" r="4" fill="#D8D8D8" stroke="#8A8A8A" stroke-width="1"/>

  <!-- Hair back layer (thick, wavy) -->
  <path d="M 120 260
           Q 95 190 130 130
           Q 170 75 250 70
           Q 330 70 360 130
           Q 385 190 355 260
           L 340 220
           Q 320 170 280 150
           Q 250 135 220 145
           Q 180 155 165 200
           Z"
        fill="url(#hairDots)"
        stroke="#0A0606"
        stroke-width="2"/>

  <!-- Hair top volume -->
  <path d="M 140 160
           Q 160 100 230 85
           Q 300 75 345 120
           Q 320 110 280 115
           Q 230 120 195 155
           Q 175 175 165 205
           Q 150 185 140 160 Z"
        fill="#120A0A"/>

  <!-- Face (3/4 view, turned right) -->
  <path d="M 150 220
           Q 150 165 210 160
           Q 275 158 300 210
           Q 310 250 300 300
           Q 295 350 260 375
           Q 230 390 200 380
           Q 165 365 155 315
           Q 148 270 150 220 Z"
        fill="url(#faceDots)"
        stroke="#C98A5A"
        stroke-width="1.2"
        stroke-opacity="0.6"/>

  <!-- Far ear hint -->
  <path d="M 148 265 Q 138 270 140 295 Q 145 305 152 300"
        fill="url(#skinShadow)" stroke="#C98A5A" stroke-width="1"/>

  <!-- Jaw shadow -->
  <path d="M 200 380 Q 240 388 270 370 Q 250 385 215 382 Z"
        fill="#C98A5A" opacity="0.35"/>

  <!-- Hair fringe over forehead (swept to left) -->
  <path d="M 155 195
           Q 175 155 220 148
           Q 265 142 295 170
           Q 305 190 300 215
           Q 280 185 245 178
           Q 205 175 175 200
           Q 165 210 158 220
           Z"
        fill="#120A0A"/>

  <!-- Eyebrows -->
  <path d="M 178 238 Q 195 232 210 238"
        fill="none" stroke="#1A1010" stroke-width="3" stroke-linecap="round"/>
  <path d="M 245 236 Q 262 230 278 238"
        fill="none" stroke="#1A1010" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes (looking right) -->
  <g>
    <!-- Far eye -->
    <ellipse cx="195" cy="255" rx="10" ry="6" fill="#FFFFFF"/>
    <circle cx="199" cy="255" r="4" fill="#3A2418"/>
    <circle cx="200" cy="254" r="1.5" fill="#FFFFFF"/>
    <!-- Near eye -->
    <ellipse cx="262" cy="253" rx="11" ry="6.5" fill="#FFFFFF"/>
    <circle cx="267" cy="253" r="4.5" fill="#3A2418"/>
    <circle cx="268" cy="252" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- Nose (shifted right for 3/4 view) -->
  <path d="M 235 260
           Q 238 295 245 315
           Q 252 322 262 318"
        fill="none" stroke="#B87A50" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 245 315 Q 255 320 262 318"
        fill="none" stroke="#8A5A38" stroke-width="1" opacity="0.6"/>

  <!-- Mustache -->
  <path d="M 215 340
           Q 235 332 255 338
           Q 270 342 282 338"
        fill="none" stroke="#1A1010" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 218 344 Q 235 340 252 344"
        fill="none" stroke="#1A1010" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Gentle smile -->
  <path d="M 210 360
           Q 235 372 265 362"
        fill="none" stroke="#8A4A38" stroke-width="2" stroke-linecap="round"/>
  <path d="M 218 358 Q 235 366 255 360"
        fill="none" stroke="#C98A5A" stroke-width="1" opacity="0.5"/>

  <!-- Chin stubble hint -->
  <g fill="#1A1010" opacity="0.25">
    <circle cx="215" cy="378" r="0.8"/>
    <circle cx="225" cy="382" r="0.8"/>
    <circle cx="235" cy="384" r="0.8"/>
    <circle cx="245" cy="383" r="0.8"/>
    <circle cx="255" cy="380" r="0.8"/>
    <circle cx="265" cy="375" r="0.8"/>
  </g>

  <!-- Subtle warm highlight on cheek -->
  <ellipse cx="230" cy="300" rx="20" ry="12" fill="#F5C9A6" opacity="0.3"/>
</svg>
