      <g>
        <rect x="548" y="428" width="54" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.45"/>
        <text x="558" y="442" fill="#10B981">NLP</text>
      </g>
      <g>
        <rect x="360" y="456" width="74" height="20" rx="10" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.45"/>
        <text x="370" y="470" fill="#22D3EE">Next.js</text>
      </g>
      <g>
        <rect x="444" y="456" width="84" height="20" rx="10" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.45"/>
