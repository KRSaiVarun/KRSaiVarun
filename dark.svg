  <!-- DIGITAL PORTRAIT — SIDE PROFILE -->
  <g clip-path="url(#portraitClip)">

    <!-- Background -->
    <rect x="55" y="118" width="410" height="420" fill="#020817"/>
    <rect x="55" y="118" width="410" height="420" fill="url(#grid)"/>

    <!-- Dark shirt and shoulders -->
    <path d="M35 545
             L45 465
             Q65 420 135 400
             L175 380
             L195 350
             L275 350
             L295 390
             L355 415
             Q420 445 440 545 Z"
          fill="#07111F"
          stroke="#22D3EE"
          stroke-width="1.5"
          stroke-opacity="0.7"/>

    <!-- Shirt digital texture -->
    <path d="M35 545
             L45 465
             Q65 420 135 400
             L175 380
             L195 350
             L275 350
             L295 390
             L355 415
             Q420 445 440 545 Z"
          fill="url(#dots)" opacity="0.45"/>

    <!-- Neck -->
    <path d="M185 305
             L185 385
             L225 420
             L270 385
             L270 300 Z"
          fill="#081321"
          stroke="#22D3EE"
          stroke-width="1.2"
          stroke-opacity="0.65"/>

    <!-- Collar -->
    <path d="M185 365
             L145 405
             L195 455
             L220 405
             L250 455
             L295 400
             L270 365
             L245 395
             L220 410 Z"
          fill="#0B1726"
          stroke="#22D3EE"
          stroke-width="1.2"
          stroke-opacity="0.6"/>

    <!-- Face side profile -->
    <path d="M155 205
             Q165 155 225 150
             Q275 150 295 190
             Q305 210 305 235
             L320 260
             Q330 270 317 277
             L307 280
             Q315 290 303 298
             Q300 320 278 340
             Q250 360 218 350
             L190 330
             Q165 300 155 265 Z"
          fill="#0B1726"
          stroke="#22D3EE"
          stroke-width="1.5"
          stroke-opacity="0.9"/>

    <!-- Face digital texture -->
    <path d="M155 205
             Q165 155 225 150
             Q275 150 295 190
             Q305 210 305 235
             L320 260
             Q330 270 317 277
             L307 280
             Q315 290 303 298
             Q300 320 278 340
             Q250 360 218 350
             L190 330
             Q165 300 155 265 Z"
          fill="url(#dots)" opacity="0.8"/>

    <!-- Hair: short, thick hairstyle -->
    <path d="M145 255
             Q125 225 135 190
             Q145 145 195 125
             Q250 100 295 135
             Q325 155 320 195
             L305 225
             L290 195
             Q270 175 240 175
             Q200 175 175 205
             L160 260 Z"
          fill="#030914"
          stroke="#22D3EE"
          stroke-width="1.5"
          stroke-opacity="0.85"/>

    <!-- Hair texture -->
    <path d="M145 255
             Q125 225 135 190
             Q145 145 195 125
             Q250 100 295 135
             Q325 155 320 195
             L305 225
             L290 195
             Q270 175 240 175
             Q200 175 175 205
             L160 260 Z"
          fill="url(#dots)" opacity="0.55"/>

    <!-- Ear -->
    <path d="M165 235
             Q140 220 135 250
             Q135 290 175 300
             L190 275
             L180 245 Z"
          fill="#0B1726"
          stroke="#22D3EE"
          stroke-width="1.5"/>

    <path d="M160 250
             Q145 240 150 265
             Q155 280 170 280"
          fill="none"
          stroke="#22D3EE"
          stroke-width="1.2"
          opacity="0.8"/>

    <!-- Eyebrow -->
    <path d="M235 220
             Q265 205 292 220"
          fill="none"
          stroke="#22D3EE"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Eye -->
    <path d="M245 238
             Q265 225 287 238
             Q265 250 245 238 Z"
          fill="#020817"
          stroke="#22D3EE"
          stroke-width="1.3"/>

    <circle cx="270" cy="238" r="4" fill="#67E8F9"/>

    <!-- Nose highlight -->
    <path d="M295 225
             L310 255
             Q325 267 315 273"
          fill="none"
          stroke="#22D3EE"
          stroke-width="1.5"
          stroke-linecap="round"/>

    <!-- Mustache -->
    <path d="M285 278
             Q300 268 315 278
             Q307 288 290 285
             Q280 284 275 290
             Q285 273 300 275 Z"
          fill="#030914"
          stroke="#22D3EE"
          stroke-width="0.8"
          stroke-opacity="0.65"/>

    <!-- Mouth -->
    <path d="M294 298
             Q307 303 316 297"
          fill="none"
          stroke="#22D3EE"
          stroke-width="1.5"
          stroke-linecap="round"/>

    <!-- Jawline -->
    <path d="M303 298
             Q290 325 260 340
             Q230 350 205 330"
          fill="none"
          stroke="#22D3EE"
          stroke-width="1.2"
          stroke-opacity="0.8"/>

    <!-- Digital scanlines -->
    <g stroke="#22D3EE" stroke-width="0.7" opacity="0.35">
      <line x1="65" y1="150" x2="455" y2="150"/>
      <line x1="65" y1="180" x2="455" y2="180"/>
      <line x1="65" y1="210" x2="455" y2="210"/>
      <line x1="65" y1="240" x2="455" y2="240"/>
      <line x1="65" y1="270" x2="455" y2="270"/>
      <line x1="65" y1="300" x2="455" y2="300"/>
      <line x1="65" y1="330" x2="455" y2="330"/>
      <line x1="65" y1="360" x2="455" y2="360"/>
      <line x1="65" y1="390" x2="455" y2="390"/>
      <line x1="65" y1="420" x2="455" y2="420"/>
      <line x1="65" y1="450" x2="455" y2="450"/>
      <line x1="65" y1="480" x2="455" y2="480"/>
      <line x1="65" y1="510" x2="455" y2="510"/>
    </g>

    <!-- Animated scanning highlight -->
    <rect x="55" y="315" width="410" height="2"
          fill="url(#scan)">
      <animate attributeName="y"
               values="130;520;130"
               dur="8s"
               repeatCount="indefinite"/>
    </rect>

  </g>
