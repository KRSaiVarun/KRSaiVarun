      <text x="40" y="414">▸ Full-Stack Applications</text>
      <text x="40" y="434">▸ Backend Architecture</text>
      <text x="40" y="454">▸ REST API Development</text>
      <text x="40" y="474">▸ AI-Powered Applications</text>
      <text x="40" y="494">▸ Data Analytics & Security Tooling</text>
    </g>

    <!-- CORE STACK pills -->
    <text x="360" y="388" class="mono label" font-size="10" letter-spacing="1.6">CORE STACK</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">
      <g>
        <rect x="360" y="400" width="74" height="20" rx="10" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.45"/>
        <text x="370" y="414" fill="#22D3EE">Python</text>
      </g>
      <g>
        <rect x="444" y="400" width="74" height="20" rx="10" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.45"/>
        <text x="454" y="414" fill="#22D3EE">Django</text>
      </g>
      <g>
        <rect x="528" y="400" width="74" height="20" rx="10" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.45"/>
        <text x="540" y="414" fill="#A78BFA">React</text>
      </g>
      <g>
        <rect x="360" y="428" width="74" height="20" rx="10" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.45"/>
        <text x="370" y="442" fill="#A78BFA">Flask</text>
      </g>
      <g>
        <rect x="444" y="428" width="94" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.45"/>
        <text x="454" y="442" fill="#10B981">PostgreSQL</text>
