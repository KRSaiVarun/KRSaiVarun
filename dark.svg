<g clip-path="url(#clip)">
  <rect x="55" y="118" width="410" height="420" fill="#020817"/>

  <defs>
    <pattern id="faceDots" width="6" height="6"
             patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#22D3EE"/>
    </pattern>

    <pattern id="bodyDots" width="7" height="7"
             patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.2"
              fill="#38BDF8" opacity="0.8"/>
    </pattern>

    <linearGradient id="scanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background digital grid -->
  <g fill="#22D3EE" opacity="0.45">
    {#each Array.from({length:25},(_,i)=>i) as i}
      <circle cx={65+i*14} cy="130" r="0.8"/>
    {/each}
  </g>

  <!-- Shoulders and upper body -->
  <path
    d="M 25 540
       L 40 470
       Q 75 425 145 405
       L 175 390
       L 245 390
       L 275 405
       Q 345 425 385 470
       L 405 540 Z"
    fill="url(#bodyDots)"
    stroke="#22D3EE"
    stroke-width="1.5"
    stroke-opacity="0.75"
  />

  <!-- Neck -->
  <path
    d="M 170 340 L 170 410
       Q 205 435 245 410
       L 245 340 Z"
    fill="url(#faceDots)"
  />

  <!-- Face silhouette -->
  <path
    d="M 145 215
       Q 145 160 205 160
       Q 270 160 275 220
       L 270 300
       Q 260 360 210 380
       Q 160 360 150 300 Z"
    fill="url(#faceDots)"
    stroke="#22D3EE"
    stroke-width="1.5"
    stroke-opacity="0.85"
  />

  <!-- Hair silhouette -->
  <path
    d="M 140 245
       Q 105 195 135 145
       Q 155 105 215 105
       Q 280 110 290 175
       L 275 245
       L 260 190
       Q 215 160 165 195 Z"
    fill="url(#bodyDots)"
    stroke="#22D3EE"
    stroke-width="1.5"
    stroke-opacity="0.9"
  />

  <!-- Digital glasses -->
  <g fill="none" stroke="#22D3EE" stroke-width="2">
    <rect x="153" y="245" width="55" height="36" rx="5"/>
    <rect x="216" y="245" width="55" height="36" rx="5"/>
    <path d="M 208 255 L 216 255"/>
  </g>

  <!-- Eyes -->
  <g fill="#67E8F9">
    <circle cx="180" cy="262" r="3"/>
    <circle cx="243" cy="262" r="3"/>
  </g>

  <!-- Nose -->
  <path
    d="M 210 270 L 205 310 L 220 312"
    fill="none"
    stroke="#22D3EE"
    stroke-width="1.5"
    opacity="0.8"
  />

  <!-- Mouth -->
  <path
    d="M 185 335 Q 210 345 235 335"
    fill="none"
    stroke="#22D3EE"
    stroke-width="1.5"
  />

  <!-- Horizontal scanning line -->
  <rect x="55" y="365" width="410" height="2"
        fill="url(#scanGlow)"/>

  <!-- Digital scanline details -->
  <g stroke="#22D3EE" stroke-width="1" opacity="0.5">
    <path d="M 65 385 H 455"/>
    <path d="M 65 410 H 455"/>
    <path d="M 65 435 H 455"/>
    <path d="M 65 460 H 455"/>
    <path d="M 65 485 H 455"/>
    <path d="M 65 510 H 455"/>
  </g>
</g>
