      <g class="mono" font-size="9.5" fill="#22D3EE" opacity="0.92">
        <text x="70" y="140">........................::::::::::::::::::::::::::::........................</text>
        <text x="70" y="152">..................::::::::::::::::::::::::::::::::::::::::::::::::..........</text>
        <text x="70" y="164">..............::::::::::::::::::::::::::::::::::::::::::::::::::::::::......</text>
        <text x="70" y="176">...........::::::::::::::::::::--------------::::::::::::::::::::...........</text>
        <text x="70" y="188">.........::::::::::::::----------==========----------::::::::::::::.........</text>
        <text x="70" y="200">........::::::::::::-------=====++++++++++=====-------::::::::::::........</text>
        <text x="70" y="212">.......::::::::::------=====+++++******+++++=====------::::::::::.......</text>
        <text x="70" y="224">......::::::::::-----====++++*************++++====-----::::::::::......</text>
        <text x="70" y="236">.....:::::::::-----====+++*******************+++====-----:::::::::.....</text>
        <text x="70" y="248">.....:::::::-----====+++*******#########*******+++====-----:::::::.....</text>
        <text x="70" y="260">....:::::::-----====+++*****##############*****+++====-----:::::::....</text>
        <text x="70" y="272">....::::::-----====+++*******#############*******+++====-----::::::....</text>
        <text x="70" y="284">....::::::-----===+++*********##########*********+++===-----::::::.....</text>
        <text x="70" y="296">....::::::-----===+++********##################********+++===-----::::::</text>
        <text x="70" y="308">....::::::-----===+++*******####################*******+++===-----:::::.</text>
        <text x="70" y="320">....:::::::-----====+++*****####################*****+++====-----::::::...</text>
        <text x="70" y="332">.....:::::::-----====+++*******##############*******+++====-----::::::.....</text>
        <text x="70" y="344">.....:::::::::-----====+++*******#############*******+++====-----:::::.....</text>
        <text x="70" y="356">......:::::::::-----====+++*******#############*******+++====-----:::::...</text>
        <text x="70" y="368">.......:::::::::------====++++***************++++====------:::::::::....</text>
        <text x="70" y="380">........:::::::::::------=====+++++*****+++++=====------:::::::::::.....</text>
        <text x="70" y="392">..........:::::::::::-------=====+++++++=====-------:::::::::::.........</text>
        <text x="70" y="404">............:::::::::::::-----==========-----:::::::::::::...........</text>
        <text x="70" y="416">..............:::::::::::::::----------:::::::::::::::..............</text>
        <text x="70" y="428">.................::::::::::::::::::::::::::::::::::.................</text>
        <text x="70" y="440">.....................::::::::::::::::::::::::.......................</text>
        <text x="70" y="452">........................::::::::::::::::..........................</text>
        <text x="70" y="464">...........................::::::::::::...........................</text>
        <text x="70" y="476">..............................::::::..............................</text>
        <text x="70" y="488">................................::................................</text>
      </g>

      <!-- Facial features overlay (glasses / eyes hint) -->
      <g class="mono" font-size="9.5" fill="#F8FAFC" opacity="0.85">
        <text x="118" y="278">●●●●●</text>
        <text x="230" y="278">●●●●●</text>
        <text x="128" y="290">╲   ╱</text>
      </g>

      <!-- Scanline sweep -->
      <line x1="55" y1="118" x2="465" y2="118" stroke="url(#scan-grad)" stroke-width="20" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 420" dur="5s" repeatCount="indefinite"/>
      </line>

      <!-- Reveal animation -->
      <rect x="55" y="118" width="410" height="420" fill="#030B17">
        <animate attributeName="opacity" from="1" to="0" dur="0.6s" fill="freeze"/>
      </rect>
    </g>

    <!-- Identity label -->
    <text x="62" y="558" class="mono label" font-size="10" letter-spacing="1.6" opacity="0.85">[ PROFILE / ENGINEERING ]</text>
    <text x="62" y="575" class="mono" font-size="11" fill="#F8FAFC">Full-Stack Developer</text>
  </g>

  <!-- ================= RIGHT PANEL — SYSTEM.INFO ================= -->
  <g transform="translate(500,0)">
    <rect x="20" y="88" width="620" height="494" rx="16" fill="#0F172A" fill-opacity="0.42" stroke="#22D3EE" stroke-opacity="0.30" stroke-width="1"/>
    <path d="M 34 88 L 152 88 L 142 106 L 34 106 Z" fill="#22D3EE" fill-opacity="0.14"/>
    <text x="40" y="101" class="mono label" font-size="10" letter-spacing="1.6">SYSTEM.INFO</text>

    <text x="40" y="132" class="mono" font-size="11" fill="#94A3B8">sai@developer:~$ ./profile.sh</text>

    <!-- Row 1: NAME -->
    <g mask="url(#type-mask-1)">
      <text x="40" y="168" class="mono label" font-size="11">NAME</text>
      <text x="180" y="168" class="mono value" font-size="14" font-weight="700">K.R. Sai Varun</text>
    </g>

    <!-- Row 2: ROLE -->
    <g mask="url(#type-mask-2)">
      <text x="40" y="202" class="mono label" font-size="11">ROLE</text>
      <text x="180" y="202" class="mono accent" font-size="13" font-weight="600">Full-Stack Developer · AI Builder</text>
    </g>

    <!-- Row 3: LOCATION -->
    <g mask="url(#type-mask-3)">
      <text x="40" y="236" class="mono label" font-size="11">LOCATION</text>
      <text x="180" y="236" class="mono value" font-size="12">Bengaluru, India</text>
    </g>

    <!-- Row 4: EDUCATION -->
    <text x="40" y="270" class="mono label" font-size="11">EDUCATION</text>
    <text x="180" y="270" class="mono value" font-size="12">BCA Graduate · Pursuing MCA</text>

    <!-- Row 5: FOCUS -->
    <text x="40" y="304" class="mono label" font-size="11">FOCUS</text>
    <text x="180" y="304" class="mono value" font-size="12">Django · React · REST APIs · NLP · Analytics</text>

    <!-- Row 6: STATUS -->
    <text x="40" y="338" class="mono label" font-size="11">STATUS</text>
    <circle cx="186" cy="334" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="198" y="338" class="mono ok" font-size="12">Open to opportunities</text>

    <!-- Divider -->
    <line x1="40" y1="360" x2="620" y2="360" stroke="#22D3EE" stroke-opacity="0.20"/>

    <!-- ENGINEERING FOCUS heading -->
