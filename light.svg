<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="K.R. Sai Varun — Full-Stack Developer profile. Django, React, AI-powered applications.">
  <defs>
    <radialGradient id="bg-glow-l" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#EEF6FF" stop-opacity="1"/>
      <stop offset="55%" stop-color="#F8FAFC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="accent-flow-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="edge-shimmer-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="22%" stop-color="#2563EB" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="78%" stop-color="#06B6D4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan-grad-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="off"/>
      <feColorMatrix in="off" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.15  0 0 0 0 0.25  0 0 0 0.18 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid-dots-l" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="0.7" fill="#2563EB" opacity="0.10"/>
    </pattern>

    <clipPath id="portrait-clip-l">
      <rect x="55" y="118" width="410" height="420" rx="10"/>
    </clipPath>

    <mask id="type-mask-1-l">
      <rect x="0" y="0" width="0" height="40" fill="#fff">
        <animate attributeName="width" from="0" to="440" dur="0.9s" begin="0.4s" fill="freeze"/>
      </rect>
    </mask>
    <mask id="type-mask-2-l">
      <rect x="0" y="0" width="0" height="40" fill="#fff">
        <animate attributeName="width" from="0" to="440" dur="0.7s" begin="1.3s" fill="freeze"/>
      </rect>
    </mask>
    <mask id="type-mask-3-l">
      <rect x="0" y="0" width="0" height="40" fill="#fff">
        <animate attributeName="width" from="0" to="440" dur="1.1s" begin="2.0s" fill="freeze"/>
      </rect>
    </mask>
  </defs>

